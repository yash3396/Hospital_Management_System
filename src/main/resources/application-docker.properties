# Use environment variables in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hospitaldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT secret (must be sufficiently long)
app.jwt.secret=${APP_JWT_SECRET:verylongrandomstring_with_32+_chars_12345678}

# Optional actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=alwaysdocker-compose up --build